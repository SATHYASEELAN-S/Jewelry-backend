services:
    redis:
        image: redis:7
        networks:
            - backend
    jewelry:
        build: .
        image: jewelry-backend:latest
        ports:
            - "8000:8000"
        networks:
            - backend
        env_file:
            - .env
        depends_on:
            - redis   
        volumes:
            - jewelry-backup:/var/libs/jewelry

    celery:
        image: jewelry-backend:latest
        command: celery -A jewelry_backend worker -l INFO
        networks:
            - backend
        env_file:
            - .env
        depends_on:
            - redis

networks:
    backend:
volumes:
    jewelry-backup: